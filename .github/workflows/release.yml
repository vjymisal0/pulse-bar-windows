name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # sign the build provenance attestation
      attestations: write  # store it
    env:
      # Untrusted input goes through env, never straight into a script.
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - run: dotnet restore
      - run: dotnet test -c Release --no-restore

      - name: Publish x64 and arm64
        shell: pwsh
        run: |
          if ($env:REF_NAME -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?)$') { throw "Tag '$env:REF_NAME' is not vX.Y.Z" }
          $version = $Matches[1]
          New-Item -ItemType Directory dist | Out-Null
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish src/PulseBar.App -c Release -r $rid --self-contained `
              -p:Version=$version -p:PublishSingleFile=true `
              -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
              -o "out/$rid"
            if ($LASTEXITCODE -ne 0) { throw "publish failed for $rid" }
            Compress-Archive -Path "out/$rid/PulseBar.exe" -DestinationPath "dist/PulseBar-$version-$rid.zip"
          }
          Get-ChildItem dist/*.zip | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding ascii dist/SHA256SUMS.txt

      # Lets anyone verify a download was built here from this exact commit:
      #   gh attestation verify PulseBar-*.zip --repo vjymisal0/pulse-bar-windows
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.zip'

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $flags = @('--generate-notes', '--title', "Pulse Bar $env:REF_NAME")
          if ($env:REF_NAME -match '^v0\.|-') { $flags += '--prerelease' }
          gh release create $env:REF_NAME (Get-ChildItem dist/*).FullName @flags
